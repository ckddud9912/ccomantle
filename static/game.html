<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>시그널 게임</title>
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/game.css" />
</head>
<body>
<div class="layout-3pane">
  <!-- 좌상: 입력 -->
  <section class="panel" id="panel-input">
    <h2>🎮 시그널</h2>
    <small>정답은 하나, 6라운드 안에 최대한 가까이 다가가 보세요.</small>

    <div class="round-badge" id="round-badge">
      <span class="round-dot"></span>
      <span id="round-label">현재 라운드: - / 6</span>
    </div>

    <div class="round-progress" id="round-progress" aria-label="라운드 진행">
      <span class="rp-dot"></span><span class="rp-dot"></span><span class="rp-dot"></span>
      <span class="rp-dot"></span><span class="rp-dot"></span><span class="rp-dot"></span>
    </div>

    <div class="meta-line" id="sim-meta">
      최상위 유사도: <span id="sim-top1">-</span>,
      20위 유사도: <span id="sim-top20">-</span>,
      1000위 유사도: <span id="sim-top1000">-</span>
    </div>

    <div class="field-label">팀 이름</div>
    <input type="text" id="team" placeholder="예: 블루팀" autofocus />

    <div class="field-label">팀 색상 선택</div>
    <input type="color" id="teamColor" value="#3b82f6" />

    <div class="field-label">제출 단어</div>
    <input type="text" id="word" placeholder="예: 정수 / 기대 / 배고픔" />

    <button id="submitBtn" onclick="sendGuess()">제출</button>

    <div class="latest-text" id="latest"></div>
  </section>

  <!-- 좌하: 현재 라운드 리더보드 -->
  <section class="panel" id="panel-current">
    <div class="panel-title-row">
      <h2>🏆 현재 라운드 리더보드</h2>
      <div class="panel-subtitle" id="answer-label"></div>
    </div>

    <div class="round-label">
      현재 라운드: <span id="current-round-text">-</span>
      <span class="round-tag">실시간 반영</span>
    </div>

    <div class="tbody-scroll">
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>팀</th>
            <th>단어</th>
            <th>유사도</th>
            <th>유사도 순위</th>
            <th>막대</th>
          </tr>
        </thead>
        <tbody id="tbody-current"></tbody>
      </table>
    </div>
  </section>

  <!-- 우: 과거 라운드 전체 (스크롤) -->
  <section class="panel" id="panel-past">
    <div class="panel-title-row">
      <h2>📜 과거 라운드 기록</h2>
      <div class="panel-subtitle">최신 라운드가 위쪽</div>
    </div>
    <div class="past-scroll" id="past-all"></div>
  </section>
</div>

<!-- 최종 결과 오버레이 -->
<div id="final-overlay">
  <div id="final-card">
    <h2>🏁 최종 결과</h2>
    <p id="final-answer" class="final-answer"></p>

    <div id="final-body">
      <!-- 섹션 1: 단어 랭킹 (모든 제출 단어 점수순) -->
      <section class="final-section">
        <h3 class="final-section-title">🥇 단어 랭킹</h3>
        <p class="final-section-desc">모든 제출 단어를 점수 높은 순으로 정렬</p>
        <div class="final-section-scroll">
          <table class="final-table">
            <thead>
              <tr>
                <th>순위</th>
                <th>단어</th>
                <th>팀</th>
                <th>R</th>
                <th>점수</th>
              </tr>
            </thead>
            <tbody id="final-words-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 섹션 2: 팀별 평균 + 베스트 단어 -->
      <section class="final-section">
        <h3 class="final-section-title">🏅 팀별 평균</h3>
        <p class="final-section-desc">각 팀의 평균 유사도와 베스트 단어</p>
        <table class="final-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>팀</th>
              <th>평균</th>
              <th>베스트 단어</th>
            </tr>
          </thead>
          <tbody id="final-teams-tbody"></tbody>
        </table>
      </section>
    </div>

    <button id="final-close">닫기</button>
  </div>
</div>

<script src="/static/js/game.js"></script>
</body>
</html>
