<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시그널 관리자</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #020617;
      color: #4a71be;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 22px;
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1e293b;
      box-shadow: 0 16px 40px rgba(15,23,42,0.8);
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      color: #fbbf24;
    }

    p {
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #9ca3af;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
      margin-right: 6px;
    }

    .btn-primary {
      background: #facc15;
      color: #111827;
    }

    .btn-ghost {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #334155;
    }

    .btn-danger {
      background: #ef4444;
      color: #f9fafb;
    }

    .status-line {
      margin-top: 6px;
      font-size: 13px;
      color: #9ca3af;
    }

    .round-buttons button {
      min-width: 38px;
      padding-inline: 0;
    }

    hr {
      border: none;
      border-top: 1px solid #111827;
      margin: 18px 0;
    }

    /* TOP1000 팝업 */
    #top1000-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.96);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    #top1000-card {
      width: min(900px, 96vw);
      max-height: 90vh;
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1e293b;
      padding: 18px 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
    }

    #top1000-card h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: #fbbf24;
    }

    #top1000-card p {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #9ca3af;
    }

    #top1000-body {
      flex: 1;
      overflow-y: auto;
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 6px 6px;
      border-bottom: 1px solid #111827;
      text-align: center;
      white-space: nowrap;
    }

    th {
      color: #9ca3af;
      font-weight: 500;
      font-size: 12px;
    }

    #top1000-close {
      margin-top: 10px;
      align-self: flex-end;
      padding-inline: 10px;
      font-size: 12px;
      background: #111827;
      color: #e5e7eb;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🛠 시그널 관리자</h1>
  <p>시그널 게임의 정답 설정, 라운드 이동, 경기 종료 및 단어 유사도 1000위 조회를 할 수 있는 화면입니다.</p>

  <div>
    <div class="section-title">정답 단어 설정</div>
    <input type="text" id="answer-input" placeholder="예: 기대 / 대박 / 행운" />
    <button class="btn-primary" id="btn-set-answer">정답 설정</button>
    <div class="status-line" id="answer-status">현재 정답: -</div>
  </div>

  <hr>

  <div>
    <div class="section-title">라운드 제어 (1~6)</div>
    <div class="round-buttons">
      <button class="btn-ghost" data-round="1">1R</button>
      <button class="btn-ghost" data-round="2">2R</button>
      <button class="btn-ghost" data-round="3">3R</button>
      <button class="btn-ghost" data-round="4">4R</button>
      <button class="btn-ghost" data-round="5">5R</button>
      <button class="btn-ghost" data-round="6">6R</button>
    </div>
    <div class="status-line" id="round-status">현재 라운드: -</div>
  </div>

  <hr>

  <div>
    <div class="section-title">경기 컨트롤</div>
    <button class="btn-ghost" id="btn-top1000">정답 기준 상위 1000 단어 보기</button>
    <button class="btn-danger" id="btn-end-game">경기 종료</button>
    <div class="status-line" id="game-status">경기 진행 중</div>
  </div>
</div>

<!-- TOP1000 팝업 -->
<div id="top1000-overlay">
  <div id="top1000-card">
    <h2>정답 기준 상위 1000 단어</h2>
    <p id="top1000-title">정답 단어: -</p>
    <div id="top1000-body">
      <table>
        <thead>
        <tr>
          <th>순위</th>
          <th>단어</th>
          <th>유사도</th>
        </tr>
        </thead>
        <tbody id="top1000-tbody"></tbody>
      </table>
    </div>
    <button id="top1000-close">닫기</button>
  </div>
</div>

<script>
  const answerInput = document.getElementById("answer-input");
  const answerStatus = document.getElementById("answer-status");
  const roundStatus = document.getElementById("round-status");
  const gameStatus = document.getElementById("game-status");

  document.getElementById("btn-set-answer").addEventListener("click", setAnswer);
  document.getElementById("btn-top1000").addEventListener("click", openTop1000);
  document.getElementById("btn-end-game").addEventListener("click", endGame);
  document.querySelectorAll(".round-buttons button").forEach(btn => {
    btn.addEventListener("click", () => changeRound(parseInt(btn.dataset.round, 10)));
  });

  document.getElementById("top1000-close").addEventListener("click", () => {
    document.getElementById("top1000-overlay").style.display = "none";
  });

  async function setAnswer() {
    const answer = answerInput.value.trim();
    if (!answer) return;

    try {
      const res = await fetch("/set_answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answer })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      answerStatus.textContent = `현재 정답: ${data.answer}`;
      gameStatus.textContent = "경기 진행 중";
    } catch (e) {
      console.error(e);
    }
  }

  async function changeRound(round) {
    try {
      const res = await fetch("/set_round", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ round })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }
      roundStatus.textContent = `현재 라운드: ${data.current_round}`;
    } catch (e) {
      console.error(e);
    }
  }

  async function endGame() {
    if (!confirm("정말로 경기를 종료하시겠습니까?")) return;
    try {
      const res = await fetch("/end_game", { method: "POST" });
      const data = await res.json();
      if (data.status === "finished") {
        gameStatus.textContent = "경기 종료됨 (게임 페이지에서 최종 결과가 표시됩니다)";
        alert("경기가 종료되었습니다. 게임 페이지에서 최종 결과가 표시됩니다.");
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function openTop1000() {
    try {
      const res = await fetch("/top1000");
      const data = await res.json();
      if (data.error) {
        alert(data.error);
        return;
      }

      document.getElementById("top1000-title").textContent =
        `정답 단어: ${data.answer ?? "-"}`;

      const tbody = document.getElementById("top1000-tbody");
      tbody.innerHTML = "";
      (data.top1000 || []).forEach(row => {
        const tr = document.createElement("tr");

        const tdRank = document.createElement("td");
        tdRank.textContent = row.rank;
        tr.appendChild(tdRank);

        const tdWord = document.createElement("td");
        tdWord.textContent = row.word;
        tr.appendChild(tdWord);

        const tdSim = document.createElement("td");
        tdSim.textContent = row.similarity.toFixed(4);
        tr.appendChild(tdSim);

        tbody.appendChild(tr);
      });

      document.getElementById("top1000-overlay").style.display = "flex";
    } catch (e) {
      console.error(e);
    }
  }

  // 초기 상태 동기화
  (async function initStatus() {
    try {
      const res = await fetch("/leaderboard");
      const data = await res.json();
      if (data.answer) {
        answerStatus.textContent = `현재 정답: ${data.answer}`;
      }
      roundStatus.textContent = `현재 라운드: ${data.current_round ?? "-"}`;
      gameStatus.textContent = data.finished ? "경기 종료됨" : "경기 진행 중";
    } catch (e) {
      console.error(e);
    }
  })();
</script>
</body>
</html>
