services:
  app:
    build: .
    container_name: ccomantle
    ports:
      - "7860:7860"
    volumes:
      # 로컬에 임베딩 파일을 두고 싶으면 data/ 에 두면 자동 마운트
      - ./data:/app/data
    environment:
      # 옵션 A: HF Hub에서 자동 다운로드 (.env 또는 export 로 설정)
      EMBEDDING_HF_REPO: ${EMBEDDING_HF_REPO:-}
      EMBEDDING_HF_FILE: ${EMBEDDING_HF_FILE:-embedding_dictionary_e5.json}
      EMBEDDING_HF_TYPE: ${EMBEDDING_HF_TYPE:-dataset}

      # 옵션 B: 직접 경로 지정 (보통 안 써도 됨, 기본값이 알아서 잡음)
      EMBEDDING_FILE: ${EMBEDDING_FILE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
